services:
  digitronix-next:
    container_name: digitronix-next
    restart: always
    image: node:20.10.0
    ports:
      - 40001:4001
    volumes:
      - ./:/usr/src/digitronix-next
    working_dir: /usr/src/digitronix-next

    networks:
      - digitronix-next

    command: bash -c "yarn install && yarn run build && PORT=4001 yarn run start"

networks:
  digitronix-next:
    driver: bridge
